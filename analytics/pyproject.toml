[project]
name = "aerosense-analytics"
version = "0.1.0"
description = "Synthetic-only analytics and deterministic retrieval for AeroSense"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "PyYAML>=6.0,<7",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
