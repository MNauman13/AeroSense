services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aerosense}
      POSTGRES_USER: ${POSTGRES_USER:-aerosense_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthetic-admin-local-only}
      APP_DB_USER: ${APP_DB_USER:-aerosense_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-synthetic-app-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  analytics:
    image: aerosense-analytics:local
    build:
      context: .
      dockerfile: analytics/Dockerfile
    restart: unless-stopped
    ports:
      - "${ANALYTICS_PORT:-8000}:8000"
    environment:
      AEROSENSE_ANSWER_PROVIDER: ${AEROSENSE_ANSWER_PROVIDER:-deterministic}
      AEROSENSE_LLM_BASE_URL: ${AEROSENSE_LLM_BASE_URL:-https://api.openai.com/v1}
      AEROSENSE_LLM_MODEL: ${AEROSENSE_LLM_MODEL:-}
      AEROSENSE_LLM_API_KEY: ${AEROSENSE_LLM_API_KEY:-}
      AEROSENSE_LLM_TIMEOUT_SECONDS: ${AEROSENSE_LLM_TIMEOUT_SECONDS:-8}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; response = urllib.request.urlopen('http://localhost:8000/health', timeout=2); assert json.load(response)['status'] == 'UP'"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  synthetic-fixtures:
    image: aerosense-analytics:local
    build:
      context: .
      dockerfile: analytics/Dockerfile
    command:
      - uv
      - run
      - --no-sync
      - python
      - -m
      - app.generate_cli
      - --rig-count
      - "3"
      - --cycle-count
      - "1000"
      - --seed
      - "20260101"
      - --output-dir
      - /demo-data
    volumes:
      - synthetic-demo-data:/demo-data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aerosense}
      DATABASE_USERNAME: ${APP_DB_USER:-aerosense_app}
      DATABASE_PASSWORD: ${APP_DB_PASSWORD:-synthetic-app-local-only}
      ANALYTICS_URL: http://analytics:8000
      RETRIEVAL_URL: http://analytics:8000
      AEROSENSE_DEMO_DATA_DIRECTORY: /demo-data
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - synthetic-demo-data:/demo-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      analytics:
        condition: service_healthy
      synthetic-fixtures:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/v1/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Flyway runs at backend startup; this profile supports a manual migration check.
  migrate:
    image: flyway/flyway:13.7.0
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "-url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aerosense}"
      - "-user=${APP_DB_USER:-aerosense_app}"
      - "-password=${APP_DB_PASSWORD:-synthetic-app-local-only}"
      - "-locations=filesystem:/flyway/sql"
      - "migrate"
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql:ro

volumes:
  postgres-data:
  synthetic-demo-data:
