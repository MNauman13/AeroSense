name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Checks and container builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.12 and uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: analytics

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check and test Java API
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress spotless:check test

      - name: Check and test Python analytics
        working-directory: analytics
        run: |
          uv sync --locked --group dev
          uv run --no-sync ruff check app tests
          uv run --no-sync ruff format --check app tests
          uv run --no-sync pytest
          uv run --no-sync python -m app.generate_cli --rig-count 3 --cycle-count 1000 --seed 20260101 --output-dir ../cloud-run/fixtures

      - name: Check and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run typecheck
          npm test
          npm run build

      - name: Build backend container
        run: docker build --tag aerosense-backend:ci --file backend/Dockerfile .

      - name: Build Cloud Run backend container
        run: docker build --tag aerosense-backend-cloudrun:ci --file backend/Dockerfile.cloudrun .

      - name: Build analytics container
        run: docker build --tag aerosense-analytics:ci --file analytics/Dockerfile .

      - name: Build frontend container
        run: docker build --tag aerosense-frontend:ci --file frontend/Dockerfile .
