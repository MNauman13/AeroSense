<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 590" role="img" aria-labelledby="title description">
  <title id="title">AeroSense demo data flow</title>
  <desc id="description">Four steps: generate a reproducible synthetic dataset, load it through the Java API, analyze unlabeled measurements with Python, and inspect trends, results, or cited notes in the dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08121c"/><stop offset="1" stop-color="#102231"/></linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16343a"/><stop offset="1" stop-color="#122530"/></linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a3450"/><stop offset="1" stop-color="#132536"/></linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#302c4a"/><stop offset="1" stop-color="#1c2236"/></linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183b3a"/><stop offset="1" stop-color="#132b31"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.23"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6fd9ca"/></marker>
    <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.heading{fill:#eff6fb;font-size:29px;font-weight:700}.sub{fill:#91aabc;font-size:14px}.num{font-size:12px;font-weight:800;letter-spacing:1px}.cardTitle{fill:#eef5fa;font-size:18px;font-weight:700}.copy{fill:#abc0ce;font-size:13px}.micro{fill:#88a5b8;font-size:10px;font-weight:700;letter-spacing:1px}</style>
  </defs>
  <rect width="1600" height="590" rx="26" fill="url(#bg)"/>
  <text x="64" y="67" class="heading">From generated readings to an explainable view</text>
  <text x="66" y="96" class="sub">A repeatable local demo flow. The Java API keeps the data and coordinates the service calls.</text>

  <path d="M382 300H418M772 300H808M1162 300H1198" stroke="#6fd9ca" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="48" y="150" width="334" height="300" rx="20" fill="url(#card1)" stroke="#3b746f"/>
    <circle cx="82" cy="186" r="17" fill="#28685f"/><text x="82" y="190" class="num" fill="#c4f2ea" text-anchor="middle">01</text>
    <text x="68" y="239" class="cardTitle">Generate a fixture</text>
    <text x="68" y="272" class="copy">A fixed seed creates fictional tests</text>
    <text x="68" y="294" class="copy">and five generated readings per run.</text>
    <rect x="68" y="330" width="294" height="87" rx="12" fill="#0c2028" stroke="#2b514f"/>
    <text x="88" y="359" class="micro">REPRODUCIBLE INPUT</text>
    <text x="88" y="386" fill="#dceef0" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">3 rigs · 1,000 cycles · fixed seed</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="438" y="150" width="334" height="300" rx="20" fill="url(#card2)" stroke="#426b8e"/>
    <circle cx="472" cy="186" r="17" fill="#315e85"/><text x="472" y="190" class="num" fill="#d4e6ff" text-anchor="middle">02</text>
    <text x="458" y="239" class="cardTitle">Load through Java</text>
    <text x="458" y="272" class="copy">The seed endpoint validates fixture</text>
    <text x="458" y="294" class="copy">data and stores the test records.</text>
    <rect x="458" y="330" width="294" height="87" rx="12" fill="#0c1c2a" stroke="#304c67"/>
    <text x="478" y="359" class="micro">SYSTEM OF RECORD</text>
    <text x="478" y="386" fill="#dce9f5" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Spring Boot → database</text>
    <text x="478" y="405" fill="#91a9bc" font-size="10" font-family="Inter,Segoe UI,Arial,sans-serif">PostgreSQL in Compose · H2 in native mode</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="828" y="150" width="334" height="300" rx="20" fill="url(#card3)" stroke="#665e91"/>
    <circle cx="862" cy="186" r="17" fill="#52487d"/><text x="862" y="190" class="num" fill="#e2dcff" text-anchor="middle">03</text>
    <text x="848" y="239" class="cardTitle">Analyze in Python</text>
    <text x="848" y="272" class="copy">The API sends unlabeled readings for</text>
    <text x="848" y="294" class="copy">cohort-relative scoring and results.</text>
    <rect x="848" y="330" width="294" height="87" rx="12" fill="#171b30" stroke="#49436a"/>
    <text x="868" y="359" class="micro">EXPLANATION SAVED</text>
    <text x="868" y="386" fill="#e5e0fb" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Score + feature contributions</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1218" y="150" width="334" height="300" rx="20" fill="url(#card4)" stroke="#3c756c"/>
    <circle cx="1252" cy="186" r="17" fill="#28675e"/><text x="1252" y="190" class="num" fill="#d0f5ee" text-anchor="middle">04</text>
    <text x="1238" y="239" class="cardTitle">Inspect in the dashboard</text>
    <text x="1238" y="272" class="copy">Compare trends, inspect one run,</text>
    <text x="1238" y="294" class="copy">or ask about cited fictional notes.</text>
    <rect x="1238" y="330" width="294" height="87" rx="12" fill="#0d211f" stroke="#315650"/>
    <text x="1258" y="359" class="micro">BROWSER EXPERIENCE</text>
    <text x="1258" y="386" fill="#d7f0eb" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">React dashboard → Java API</text>
  </g>

  <rect x="48" y="490" width="1504" height="56" rx="15" fill="#172330" stroke="#344858"/>
  <circle cx="76" cy="518" r="6" fill="#f0b862"/>
  <text x="96" y="522" fill="#e7d9b7" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Evaluation labels are kept out of scoring and ordinary browsing.</text>
  <text x="1520" y="522" fill="#94a8b7" font-size="12" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="end">All fixtures and outcomes are fictional.</text>
</svg>
